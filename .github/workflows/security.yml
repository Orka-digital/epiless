name: Security
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Audit direct and transitive dependencies
        run: pnpm audit --audit-level high
      - name: Check workflow pins and documentation contracts
        run: node scripts/check-docs.mjs
      - name: Verify publication and update trust boundaries
        run: pnpm exec vitest run tests/backend packages/core packages/rule-feed
