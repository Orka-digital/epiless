name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test
      - name: Compare WASM state and detections with the frozen JavaScript engine
        run: |
          mkdir -p artifacts
          node packages/analysis-engine/bench/wasm-dense.mjs --output artifacts/wasm-dense-proof.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wasm-dense-differential-${{ github.sha }}
          path: artifacts/wasm-dense-proof.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Measure the synthetic local index
        run: pnpm benchmark:index
      - name: Verify external detection reference integrity and comparison
        run: |
          node --import tsx --test tests/reference/validate-detection.test.mjs
          node --import tsx --test tests/reference/validate-expanded.test.mjs
          mkdir -p artifacts
          pnpm --silent validate:detection --check-baseline > artifacts/detection-reference.json
          pnpm --silent validate:expanded --check-baseline > artifacts/detection-expanded.json
      - name: Install lossless reference media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify original masks and lossless encoded media
        run: |
          node --import tsx --test tests/reference/spatial-media.test.mjs
          pnpm --silent validate:spatial-media --check-baseline > artifacts/spatial-media.json
      - name: Verify frozen alternating corpus and current lossless regression
        run: |
          node --import tsx --test tests/reference/validate-alternating-heldout.test.mjs tests/reference/validate-alternating-regression.test.mjs
          node --import tsx scripts/validate-alternating-regression.mjs --output artifacts/alternating-regression.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-index-benchmark-${{ github.sha }}
          path: |
            artifacts/index-benchmark.json
            artifacts/detection-reference.json
            artifacts/detection-expanded.json
            artifacts/spatial-media.json
            artifacts/alternating-regression.json
          retention-days: 7
          if-no-files-found: error
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-development-${{ github.sha }}
          path: apps/chrome-extension/dist/
          if-no-files-found: error
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm setup:local
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:web-quality
      - name: Exercise extension persistence, publication bridge and safe actions
        run: pnpm --filter @epi-less/chrome-extension test:browser
      - name: Verify encoded fixture integrity and actual browser decoding
        run: |
          mkdir -p artifacts
          node tests/extension/preflight-native-encoded.mjs tests/extension/fixtures/native-encoded artifacts/encoded-video-preflight.json
      - name: Exercise review buttons with retained native evidence
        run: pnpm test:review-ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-quality-${{ github.sha }}
          path: |
            artifacts/mobile-lab.json
            artifacts/first-render-budgets.json
            artifacts/epi-less-mobile.png
            artifacts/encoded-video-preflight.json
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/check-docs.mjs
  required:
    if: always()
    needs: [checks, unit, build, browser, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs must succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
          const jobs = Object.values(JSON.parse(process.env.JOB_RESULTS));
          if (jobs.length !== 5 || jobs.some(job => job.result !== "success")) {
            console.error("A required job failed, was cancelled or was skipped.");
            process.exit(1);
          }'
